services:
  llama-architect:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    runtime: nvidia
    container_name: llama-architect
    restart: unless-stopped

    # Разрешаем mlock: llama.cpp сможет закреплять память,
    # если используется флаг --mlock.
    ulimits:
      memlock:
        soft: -1
        hard: -1

    environment:
      # GPU 0 и 2 — карты на ограниченных PCIe-линиях.
      # На них запускается тяжёлая 27B-модель.
      - NVIDIA_VISIBLE_DEVICES=0,2
      - GGML_CUDA_NO_VMM=1
      - GGML_LOG_LEVEL=INFO

    volumes:
      - /opt/llama-cluster/models:/models:ro
      - /opt/llama-cluster/cache/architect:/cache

    ports:
      - "8080:8080"

    command: >
      --host 0.0.0.0
      --port 8080
      --model /models/Qwen3.6-27B-UD-Q4_K_XL.gguf
      --ctx-size 40000
      --flash-attn on
      --gpu-layers 999
      --parallel 1
      --main-gpu 0
      --tensor-split 1,1
      --split-mode layer
      --no-mmap
      --mlock
      --metrics
      --cache-type-k q8_0
      --cache-type-v q8_0
      --cache-ram 0

  llama-coder:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    runtime: nvidia
    container_name: llama-coder
    restart: unless-stopped

    # Разрешаем mlock: llama.cpp сможет закреплять память,
    # если используется флаг --mlock.
    ulimits:
      memlock:
        soft: -1
        hard: -1

    environment:
      # GPU 1 — карта в основном PCIe x16.
      # На ней запускается быстрая 9B-модель.
      - NVIDIA_VISIBLE_DEVICES=1
      - GGML_CUDA_NO_VMM=1
      - GGML_LOG_LEVEL=INFO

    volumes:
      - /opt/llama-cluster/models:/models:ro
      - /opt/llama-cluster/cache/coder:/cache

    ports:
      - "8081:8080"

    command: >
      --host 0.0.0.0
      --port 8080
      --model /models/Qwen3.5-9B-UD-Q4_K_XL.gguf
      --ctx-size 40000
      --flash-attn on
      --gpu-layers 999
      --parallel 1
      --main-gpu 0
      --no-mmap
      --mlock
      --metrics
      --cache-type-k q8_0
      --cache-type-v q8_0
      --cache-ram 0

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - LITELLM_LOG=INFO

    volumes:
      - /opt/llama-cluster/config/litellm.config.yaml:/app/config.yaml:ro

    ports:
      - "4000:4000"

    command: >
      --config /app/config.yaml
      --host 0.0.0.0
      --port 4000

    depends_on:
      - llama-coder
      - llama-architect

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped

    ports:
      - "3000:8080"

    environment:
      # Stage 3: Open WebUI goes through LiteLLM Gateway.
      - OPENAI_API_BASE_URLS=http://litellm:4000/v1
      - OPENAI_API_KEYS=${LITELLM_MASTER_KEY}

      # Stage 1 direct backend config kept for quick rollback:
      # - OPENAI_API_BASE_URLS=http://llama-coder:8080/v1;http://llama-architect:8080/v1
      # - OPENAI_API_KEYS=dummy;dummy

      - WEBUI_AUTH=False
      - ENABLE_PERSISTENT_CONFIG=False
      - ENABLE_OLLAMA_API=False

    volumes:
      - open-webui:/app/backend/data

  memory-db:
    image: pgvector/pgvector:0.8.3-pg17
    container_name: memory-db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: "${MEMORY_POSTGRES_DB:?Set MEMORY_POSTGRES_DB in .env}"
      POSTGRES_USER: "${MEMORY_POSTGRES_USER:?Set MEMORY_POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${MEMORY_POSTGRES_PASSWORD:?Set MEMORY_POSTGRES_PASSWORD in .env}"
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - memory-db-data:/var/lib/postgresql/data
      - /opt/llama-cluster/config/memory/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  memory-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: memory-embed
    restart: unless-stopped

    volumes:
      - /opt/llama-cluster/models:/models:ro

    ports:
      - "127.0.0.1:4010:8080"

    command: >
      --host 0.0.0.0
      --port 8080
      --model /models/embeddings/Qwen3-Embedding-0.6B-Q8_0.gguf
      --ctx-size 32768
      --embedding
      --pooling last
      --ubatch-size 8192
      --gpu-layers 0
      --parallel 1
      --cache-ram 0

    depends_on:
      - memory-db

volumes:
  open-webui:
  memory-db-data:
